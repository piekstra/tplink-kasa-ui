services:
  ui:
    build: .
    image: ghcr.io/piekstra/tplink-kasa-ui:latest
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Not host-exposed; reachable only through the ui's nginx /api proxy
  api:
    image: ghcr.io/piekstra/tplinkcloud-service:latest
    environment:
      DEVICE_CACHE_TTL: '60'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/time')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
